# AeroTwin Docker Compose
# Note: 'version' key removed — deprecated in Compose V2+
# DATABASE_URL uses postgresql+asyncpg:// for SQLAlchemy 2.x async engine

services:
  # Database Service (PostgreSQL)
  db:
    image: postgres:16-alpine
    container_name: aerotwin-db
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-aerotwin_dev}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Backend Service (FastAPI)
  backend:
    build:
      context: ./backend
      dockerfile: ../docker/backend.Dockerfile
    container_name: aerotwin-backend
    restart: always
    volumes:
      - ./backend:/workspace/backend
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    environment:
      - ENVIRONMENT=development
      - DEBUG=true
      # asyncpg driver required for SQLAlchemy 2.x async engine
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-aerotwin_dev}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - CESIUM_ION_TOKEN=${CESIUM_ION_TOKEN:-}
      - MAPBOX_ACCESS_TOKEN=${MAPBOX_ACCESS_TOKEN:-}
    depends_on:
      db:
        condition: service_healthy

  # Frontend Service (Vite + React)
  frontend:
    build:
      context: ./frontend
      dockerfile: ../docker/frontend.Dockerfile
    container_name: aerotwin-frontend
    restart: always
    volumes:
      - ./frontend:/workspace/frontend
      - /workspace/frontend/node_modules
    ports:
      - "${FRONTEND_PORT:-5173}:5173"
    environment:
      - VITE_API_URL=http://localhost:${BACKEND_PORT:-8000}
    depends_on:
      - backend

volumes:
  postgres_data:
