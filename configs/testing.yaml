# AeroTwin Testing Configuration
app:
  name: "AeroTwin"
  env: "testing"
  debug: true
  api_prefix: "/api/v1"
  version: "0.1.0"

database:
  url: null
  pool_size: 5
  max_overflow: 10
  pool_timeout: 30
  pool_recycle: 1800

http:
  cors_origins: ["*"]
  trusted_hosts: ["*"]
  gzip_minimum_size: 1000
