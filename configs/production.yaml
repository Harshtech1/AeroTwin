# AeroTwin Production Configuration
app:
  name: "AeroTwin"
  env: "production"
  debug: false
  api_prefix: "/api/v1"
  version: "0.1.0"

database:
  url: null # Required at runtime through DATABASE_URL or a mounted secret.
  pool_size: 10
  max_overflow: 20
  pool_timeout: 30
  pool_recycle: 1800

http:
  cors_origins: ["https://aerotwin.example.com"]
  trusted_hosts: ["aerotwin.example.com"]
  gzip_minimum_size: 1000
